plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

tasks.register("ensureGitLfsAssets") {
    def modelFile = rootProject.file('../assets/models/model.int8.onnx')
    onlyIf {
        return !modelFile.exists() || modelFile.length() < 1024 * 1024
    }
    doLast {
        println "Downloading Git LFS assets for EasyPlayer..."
        exec {
            workingDir rootProject.file('..')
            commandLine 'git', 'lfs', 'pull', '--include=assets/models/model.int8.onnx'
            ignoreExitValue = true
        }
        if (!modelFile.exists() || modelFile.length() < 1024 * 1024) {
            logger.warn("WARNING: Failed to download assets/models/model.int8.onnx via Git LFS. Please run 'git lfs pull' manually.")
        } else {
            logger.lifecycle("Successfully downloaded assets/models/model.int8.onnx via Git LFS.")
        }
    }
}

tasks.named("preBuild") {
    dependsOn "ensureGitLfsAssets"
}

android {
    namespace "com.pandasoft.easyplayer"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.pandasoft.easyplayer"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
