name: easy_player
description: "EasyPlayer - Modern cross-platform media player with on-device speech-to-text captions by PandaSoft"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Media Playback Engine (libmpv + FFmpeg)
  media_kit: ^1.1.10
  media_kit_video: ^1.0.6
  media_kit_libs_windows_video: ^1.0.8
  media_kit_libs_android_video: ^1.2.6

  # Local Storage & Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cryptography & Hashing (Fast Hybrid Hash)
  crypto: ^3.0.3

  # Audio tag extraction & character encoding
  charset_converter: ^2.1.1
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9
  file_selector: ^1.0.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - artwork/
    - assets/models/
